<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Jérémy, alias ZenoX. Développeur full stack, cloud, mobile et IA basé à Paris."><title>Jérémy, alias ZenoX. Développeur full stack, cloud, mobile et IA basé à Paris.</title><style>
      .w { opacity: 0; animation: swap 13.0s cubic-bezier(.2,.7,.2,1) infinite both; }
      .w0 { opacity: 1; }
      @keyframes swap {
        0% { opacity: 0; transform: translateY(18px); }
        4% { opacity: 1; transform: translateY(0); }
        17.00% { opacity: 1; transform: translateY(0); }
        20.00% { opacity: 0; transform: translateY(-18px); }
        100% { opacity: 0; transform: translateY(-18px); }
      }
      .o1 { animation: drift1 22s ease-in-out infinite alternate; }
      .o2 { animation: drift2 26s ease-in-out infinite alternate; }
      .o3 { animation: drift3 30s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(-90px, 50px); } }
      @keyframes drift2 { to { transform: translate(70px, -60px); } }
      @keyframes drift3 { to { transform: translate(-50px, -40px); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .w, .o1, .o2, .o3, .cursor { animation: none; }
        .w0 { opacity: 1; }
      }
    </style>
      <defs>
